    document.addEventListener("visibilitychange",function(){if(document.hidden)clearTimeout(t);});
    location.href=PLAY_APP;
  }else if(isIOS){
    msg.textContent="Opening the App Store…";
    location.replace(IOS_WEB);
  }
})();
</script>
</body>
</html>
